name: Publish cross-platform validated release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Verify tag matches package versions
        shell: pwsh
        run: |
          $packageNames = @('shitu', 'shiping', 'shiping-android')
          $packages = @(
            (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
              Where-Object { $_.name -in $packageNames }
          )
          if ($packages.Count -ne $packageNames.Count) {
            $foundNames = @($packages | ForEach-Object name)
            $missingNames = @($packageNames | Where-Object { $_ -notin $foundNames })
            throw "Cargo workspace packages were not found: $($missingNames -join ', ')"
          }

          foreach ($package in $packages) {
            $expectedTag = "v$($package.version)"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Release tag $env:GITHUB_REF_NAME must match $($package.name) version $expectedTag"
            }
          }

  release-build:
    name: Build ${{ matrix.name }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            kind: windows
            architecture: x86_64
            artifact_name: windows-x86_64
          - name: Linux x64
            os: ubuntu-24.04
            kind: linux
            architecture: x86_64
            artifact_name: shiping-linux-x86_64
          - name: ShiPing macOS ARM64
            os: macos-15
            kind: macos
            architecture: arm64
            artifact_name: shiping-macos-arm64
          - name: ShiPing macOS x64
            os: macos-15-intel
            kind: macos
            architecture: x86_64
            artifact_name: shiping-macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-shiping-${{ matrix.artifact_name }}

      - name: Install Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev \
            libfontconfig1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Test ShiPing
        if: matrix.kind != 'windows'
        run: cargo test --locked --package shiping

      - name: Test Windows workspace
        if: matrix.kind == 'windows'
        run: cargo test --workspace --locked

      - name: Build ShiPing release binary
        run: cargo build --release --locked --package shiping --bin ShiPing

      - name: Build ShiTu release binary
        if: matrix.kind == 'windows'
        run: cargo build --release --locked --package shitu --bin ShiTu

      - name: Build Microsoft Store upload assets
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $packages = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages
          $storeProducts = @(
            @{
              Product = 'ShiTu'
              PackageName = 'shitu'
              Executable = '.\target\release\ShiTu.exe'
            },
            @{
              Product = 'ShiPing'
              PackageName = 'shiping'
              Executable = '.\target\release\ShiPing.exe'
            }
          )

          foreach ($storeProduct in $storeProducts) {
            $package = $packages |
              Where-Object name -eq $storeProduct.PackageName |
              Select-Object -First 1
            if ($null -eq $package) {
              throw "Cargo workspace package $($storeProduct.PackageName) was not found."
            }
            .\tools\package-store-msix.ps1 `
              -Product $storeProduct.Product `
              -ExecutablePath $storeProduct.Executable `
              -Version $package.version `
              -OutputDirectory .\release-assets
          }

      - name: Package Windows release assets
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $products = @(
            @{
              Name = 'ShiTu'
              Executable = 'target\release\ShiTu.exe'
            },
            @{
              Name = 'ShiPing'
              Executable = 'target\release\ShiPing.exe'
            }
          )

          foreach ($product in $products) {
            if (-not (Test-Path -LiteralPath $product.Executable -PathType Leaf)) {
              throw "Expected release executable was not produced: $($product.Executable)"
            }

            $archiveName = "$($product.Name)-$env:GITHUB_REF_NAME-windows-x86_64.zip"
            $archivePath = Join-Path 'release-assets' $archiveName
            Compress-Archive -LiteralPath $product.Executable -DestinationPath $archivePath -Force

            $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$archiveName" | Set-Content -LiteralPath "$archivePath.sha256" -Encoding ascii -NoNewline
          }

      - name: Package ShiPing Linux release
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          bash ./tools/package-shiping-linux.sh \
            ./target/release/ShiPing \
            "$GITHUB_REF_NAME" \
            "${{ matrix.architecture }}"

      - name: Package ShiPing macOS release
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          bash ./tools/package-shiping-macos.sh \
            ./target/release/ShiPing \
            "$GITHUB_REF_NAME" \
            "${{ matrix.architecture }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  android-release-build:
    name: Build ShiPing Android ARM64 test APK
    needs: release-metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.5.1'

      - name: Prepare Android SDK 33 toolchain
        shell: bash
        run: |
          sdkmanager_path="$(
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit
          )"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-33"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_NDK_ROOT"
          gradle --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-shiping-android-arm64

      - name: Install pinned xbuild
        run: cargo install --git https://github.com/rust-mobile/xbuild.git --rev e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1

      - name: Build debug-signed Android test APK
        working-directory: apps/shiping-android
        shell: bash
        env:
          RUST_BACKTRACE: '1'
          XBUILD_LOG: error
        run: |
          log_file="$RUNNER_TEMP/shiping-android-build.log"
          set +e
          x build --verbose --platform android --arch arm64 --format apk --release 2>&1 |
            tee "$log_file"
          status="${PIPESTATUS[0]}"
          set -e

          if [ "$status" -ne 0 ]; then
            python - "$log_file" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(
              encoding="utf-8", errors="replace"
          )
          lines = text.splitlines()
          error_lines = [
              line for line in lines
              if any(marker in line.lower() for marker in (
                  "error",
                  "failed",
                  "failure",
                  "caused by",
                  "not found",
                  "cannot find",
                  "panicked",
              ))
          ]
          selected = error_lines[-60:] + ["--- final output ---"] + lines[-30:]
          message = "\n".join(selected)[-12000:]
          message = (
              message.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Android xbuild failed::{message}")
          PY
          fi

          exit "$status"

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shiping-android-build-diagnostics
          path: ${{ runner.temp }}/shiping-android-build.log
          if-no-files-found: warn

      - name: Package Android test APK
        shell: bash
        run: |
          mapfile -t apks < <(find target/x/release/android -maxdepth 1 -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            printf 'Expected exactly one Android APK, found %s\n' "${#apks[@]}" >&2
            exit 1
          fi

          mkdir -p release-assets
          asset="ShiPing-${GITHUB_REF_NAME}-android-arm64-test.apk"
          cp "${apks[0]}" "release-assets/$asset"
          sha256sum "release-assets/$asset" > "release-assets/$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: shiping-android-arm64-test
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs:
      - release-build
      - android-release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
