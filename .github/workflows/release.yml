name: Publish cross-platform validated release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Verify tag matches package versions
        shell: pwsh
        run: |
          $packageNames = @('shitu', 'shiping')
          $packages = @(
            (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
              Where-Object { $_.name -in $packageNames }
          )
          if ($packages.Count -ne $packageNames.Count) {
            $foundNames = @($packages | ForEach-Object name)
            $missingNames = @($packageNames | Where-Object { $_ -notin $foundNames })
            throw "Cargo workspace packages were not found: $($missingNames -join ', ')"
          }

          foreach ($package in $packages) {
            $expectedTag = "v$($package.version)"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Release tag $env:GITHUB_REF_NAME must match $($package.name) version $expectedTag"
            }
          }

  platform-validation:
    name: Validate ShiPing (${{ matrix.platform }})
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-15
          - platform: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-shiping-${{ runner.os }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev \
            libfontconfig1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Compile ShiPing
        run: cargo check --locked --package shiping

      - name: Test ShiPing
        run: cargo test --locked --package shiping

  release-build:
    name: Build Windows x64
    needs: platform-validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Test
        run: cargo test --workspace --locked

      - name: Build ShiTu release binary
        run: cargo build --release --locked --package shitu --bin ShiTu

      - name: Build ShiPing release binary
        run: cargo build --release --locked --package shiping --bin ShiPing

      - name: Build Microsoft Store upload assets
        shell: pwsh
        run: |
          $packages = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages
          $storeProducts = @(
            @{
              Product = 'ShiTu'
              PackageName = 'shitu'
              Executable = '.\target\release\ShiTu.exe'
            },
            @{
              Product = 'ShiPing'
              PackageName = 'shiping'
              Executable = '.\target\release\ShiPing.exe'
            }
          )

          foreach ($storeProduct in $storeProducts) {
            $package = $packages |
              Where-Object name -eq $storeProduct.PackageName |
              Select-Object -First 1
            if ($null -eq $package) {
              throw "Cargo workspace package $($storeProduct.PackageName) was not found."
            }
            .\tools\package-store-msix.ps1 `
              -Product $storeProduct.Product `
              -ExecutablePath $storeProduct.Executable `
              -Version $package.version `
              -OutputDirectory .\release-assets
          }

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $products = @(
            @{
              Name = 'ShiTu'
              Executable = 'target\release\ShiTu.exe'
            },
            @{
              Name = 'ShiPing'
              Executable = 'target\release\ShiPing.exe'
            }
          )

          foreach ($product in $products) {
            if (-not (Test-Path -LiteralPath $product.Executable -PathType Leaf)) {
              throw "Expected release executable was not produced: $($product.Executable)"
            }

            $archiveName = "$($product.Name)-$env:GITHUB_REF_NAME-windows-x86_64.zip"
            $archivePath = Join-Path 'release-assets' $archiveName
            Compress-Archive -LiteralPath $product.Executable -DestinationPath $archivePath -Force

            $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$archiveName" | Set-Content -LiteralPath "$archivePath.sha256" -Encoding ascii -NoNewline
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
