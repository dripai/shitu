name: ShiTu CI

on:
  push:
    branches:
      - main
  pull_request:
  # Explicit cloud checks without publishing release assets.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Cargo lockfile
    # Code-only pushes keep local checks; releases run checks in release.yml.
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[code-only]') &&
       !contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Verify Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null

  format:
    name: Rustfmt
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[code-only]') &&
       !contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  shitu:
    name: ShiTu (Windows)
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[code-only]') &&
       !contains(github.event.head_commit.message, '[release]'))
    needs: lockfile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shitu-windows
      - name: Compile ShiTu
        run: cargo check --locked --package shitu
      - name: Test ShiTu workspace
        run: cargo test --workspace --locked
