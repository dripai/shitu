name: ShiTu CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    name: Cargo lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Verify Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null

  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  shitu:
    name: ShiTu (Windows)
    needs: lockfile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shitu-windows
      - name: Compile ShiTu
        run: cargo check --locked --package shitu
      - name: Test ShiTu workspace
        run: cargo test --workspace --locked
