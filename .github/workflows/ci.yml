name: Cross-platform CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  shiping:
    name: ShiPing (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-15
          - platform: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shiping-${{ runner.os }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev \
            libfontconfig1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Compile ShiPing
        run: cargo check --locked --package shiping

      - name: Test ShiPing
        run: cargo test --locked --package shiping

  shiping-android:
    name: ShiPing Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36 toolchain
        shell: bash
        run: |
          sdkmanager_path="$(
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit
          )"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          test -d "$ANDROID_NDK_ROOT"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-shiping-android-arm64

      - name: Test Android Rust state and JNI
        run: cargo test --locked --package shiping-android --features android-jni-check

      - name: Build Android Rust shared library
        shell: bash
        run: |
          llvm_bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$llvm_bin/aarch64-linux-android26-clang"
          cargo build \
            --release \
            --locked \
            --package shiping-android \
            --target aarch64-linux-android
          native_dir="apps/shiping-android/android/native-libs/arm64-v8a"
          mkdir -p "$native_dir"
          cp \
            target/aarch64-linux-android/release/libshiping_android.so \
            "$native_dir/libshiping_android.so"

      - name: Compile Android Compose application
        working-directory: apps/shiping-android/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
