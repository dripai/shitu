[package]
name = "shiping"
version.workspace = true
edition.workspace = true
description = "ShiPing screen recorder UI prototype"
publish = false
autobins = false

[[bin]]
name = "ShiPing"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gif.workspace = true
global-hotkey.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
shi-foundation = { path = "../../crates/shi-foundation" }
slint = { workspace = true, features = ["unstable-winit-030"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd.workspace = true
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# apple-metal 0.8.x uses macOS 26 Metal symbols even when targeting macOS 15.
apple-metal = { version = "=0.6.0", default-features = false }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVMediaFormat",
    "AVVideoSettings",
    "block2",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAudioSettings",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFDictionary",
    "CFString",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "objc2",
    "objc2-core-audio-types",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferPool",
    "CVReturn",
    "objc2",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
rfd.workspace = true
screencapturekit = { version = "8.0.1", features = ["macos_15_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.9.2"
rfd = { workspace = true, features = ["tokio", "xdg-portal"] }
tokio = { version = "1.49", features = ["net", "rt", "time"] }

[build-dependencies]
shi-ui = { path = "../../crates/shi-ui" }
slint-build.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource.workspace = true
