[package]
name = "shiping"
version.workspace = true
edition.workspace = true
description = "ShiPing screen recorder UI prototype"
publish = false
autobins = false

[[bin]]
name = "ShiPing"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gif.workspace = true
global-hotkey.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
shi-foundation = { path = "../../crates/shi-foundation" }
slint = { workspace = true, features = ["unstable-winit-030"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd.workspace = true
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rfd.workspace = true
screencapturekit = { version = "8.0.1", features = ["macos_15_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.9.2"
rfd = { workspace = true, features = ["tokio", "xdg-portal"] }
tokio = { version = "1.49", features = ["net", "rt", "time"] }

[build-dependencies]
shi-ui = { path = "../../crates/shi-ui" }
slint-build.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource.workspace = true
