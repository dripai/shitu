android:
  gradle: true
  wry: false
  manifest:
    package: com.dripai.shiping
    compile_sdk_version: 33
    sdk:
      min_sdk_version: 26
      target_sdk_version: 33
    application:
      label: ShiPing
      theme: "@android:style/Theme.Material.NoActionBar"
      has_code: true
      activities:
        - name: com.dripai.shiping.MainActivity
          exported: true
          launch_mode: singleTop
          window_soft_input_mode: adjustResize
          hardware_accelerated: true
          config_changes: "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
