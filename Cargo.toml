[package]
name = "shitu"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
description = "Windows screenshot, annotation, OCR and pinning utility"
publish = false

[[bin]]
name = "ShiTu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
gpui-kit = "=0.7.1"
tray-icon = "=0.21.2"
global-hotkey = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6"
rfd = { version = "0.15.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
windows-future = "0.3.2"

[build-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
regex = "1.12.4"
rspolib = "0.1.2"
serde_json = "1.0"
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
